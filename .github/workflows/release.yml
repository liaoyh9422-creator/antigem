name: Build & Publish Release

on:
  push:
    branches:
      - standalone
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # full history: the app's "What's new" page is generated from every commit of version.json
          fetch-depth: 0

      # termux-am (termux/TermuxAm): am.apk is built from it for ai.antigem. Only this submodule: the other folders
      # (termux-api, termux-x11, antigem_plugins) are embedded repos without a .gitmodules entry.
      - name: Fetch the termux-am submodule
        run: git submodule update --init --depth 1 termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release is the newer of version.json's stable release and its beta (scripts/release_version.py, the same
      # rule as the Gradle build, which also checks the file). A beta is published as a pre-release that is not
      # "Latest", so the repo's latest release (and the links to it) stay on the stable version.
      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 scripts/release_version.py name)
          CHANNEL=$(python3 scripts/release_version.py channel)
          CHANGELOG=$(python3 scripts/release_version.py changelog)
          if [ "$CHANNEL" = "beta" ]; then
            CHANGELOG="Beta for testing: it installs over the stable app and keeps your data. Going back to the stable version means waiting for the next stable release (or uninstalling).

          ${CHANGELOG}"
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Restore Keystore from Secret or Repo
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
