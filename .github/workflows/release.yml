          fi

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      # R8 mapping of the arm64 APK, to decode its crash stack traces (retrace). The x86_64 build below
      # writes the same path, so copy it now.
      - name: Save arm64 R8 mapping
        run: zip -j "output/AntiGem-${{ steps.version.outputs.tag }}-mapping.zip" app/build/outputs/mapping/release/mapping.txt

      # AntiGem-v<version>-chroot.apk: the arm64 app with the Ubuntu chroot's Linux bridge (rooted phones). The normal
      # APK above leaves that bridge out and installs this one over itself from its chroot page; the chroot app's
      # updater downloads this file.
      - name: Build chroot Release APK
        run: ./scripts/build_all_apks.sh --release --chroot

      - name: Save chroot R8 mapping
        run: zip -j "output/AntiGem-${{ steps.version.outputs.tag }}-chroot-mapping.zip" app/build/outputs/mapping/release/mapping.txt

      # AntiGem-v<version>-x86_64.apk, for x86_64 devices (emulators, Intel/AMD Chromebooks), with the chroot's Linux
      # bridge too; the x86_64 app's updater downloads this one. Its bridge links through the Android NDK's clang,
      # which the runner has (ANDROID_NDK_HOME).
      - name: Build x86_64 Release APK
        run: ./scripts/build_all_apks.sh --release --x86_64

      - name: Save x86_64 R8 mapping
        run: zip -j "output/AntiGem-${{ steps.version.outputs.tag }}-x86_64-mapping.zip" app/build/outputs/mapping/release/mapping.txt

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Chinese-Release-APKs
          path: output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.changelog }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          generate_release_notes: true
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
